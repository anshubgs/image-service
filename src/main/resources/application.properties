# =====================================================
# APPLICATION
# =====================================================
spring.application.name=image-service
server.port=8081
server.address=0.0.0.0
spring.profiles.active=prod

# =====================================================
# DATABASE (POSTGRES)
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/monitoring
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=image
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================================================
# LIQUIBASE
# =====================================================
spring.liquibase.enabled=true
spring.liquibase.default-schema=image
spring.liquibase.liquibase-schema=image
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# =====================================================
# JACKSON / TIMEZONE
# =====================================================
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# REDIS (CACHE)
# =====================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.cache.type=redis

# =====================================================
# LOGGING
# =====================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# =====================================================
# SWAGGER / OPENAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =====================================================
# TOMCAT / SERVER TUNING
# =====================================================
server.tomcat.connection-timeout=60s
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

spring.mvc.async.request-timeout=60000

# =====================================================
# ASYNC EXECUTOR
# =====================================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=image-async-

# =====================================================
# MANAGEMENT / ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# MULTIPART (UPLOAD ENABLED – GCS)
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# GCP PROJECT CONFIG
# =====================================================
spring.cloud.gcp.project-id=image-device-platform
spring.cloud.gcp.credentials.location=file:C:/GCP Cloud/image-device-platform-464e24d1f2a2.json
#=file:C:/GCP Cloud/image-storage-sa.json



# =====================================================
# GCP CLOUD STORAGE (IMAGES)
# =====================================================
gcs.bucket.name=image-device-platform-bucket

# Folder inside bucket
gcs.object.base-path=devices

# Signed URL expiry (minutes)
gcs.signed-url.expiry-minutes=15

# =====================================================
# PUB/SUB (DEVICE EVENTS)
# =====================================================
spring.cloud.gcp.pubsub.enabled=true

pubsub.subscription.device-registered=image-service-sub
pubsub.subscription.device-status-updated=device-status-updated-sub

# =====================================================
# EXTERNAL SERVICES
# =====================================================
device.service.url=http://localhost:8080
spring.devtools.restart.enabled=false

